# Static hosting for the PWA (CHORE-007).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Client-side routing: every unknown path is the SPA shell, NOT a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable; the shell and the service worker must never be
  # cached, or a deploy cannot reach a browser that already has the old one.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # The API sets its own security headers (helmet); these cover the static origin.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
