<!doctype html>
<html lang="en" data-look="vercel" data-theme="mono" data-accent="mono" data-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- FEAT-016: viewport-fit=cover lets the app draw under the notch and home bar;
         safe-area insets keep content clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- FEAT-016 (ADR-0028): apply the remembered scheme and palette BEFORE first paint,
         so a night user never sees a white flash. Mirrors lib/appearance.ts; storage may
         be unavailable, in which case the system scheme and Mono apply (FEAT-017). -->
    <script>
      (function () {
        var d = document.documentElement, pref = 'system', pal = 'mono';
        // FEAT-019 (ADR-0031): one look, seven accents; retired glass palettes migrate.
        var ACCENTS = ['mono', 'ocean', 'aurora', 'bloom', 'sunset', 'forest', 'lagoon'];
        var LEGACY = { teal: 'lagoon', indigo: 'aurora', ember: 'sunset' };
        try {
          pref = localStorage.getItem('bulk:scheme') || 'system';
          pal = localStorage.getItem('bulk:palette') || 'mono';
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (ACCENTS.indexOf(pal) < 0) pal = Object.prototype.hasOwnProperty.call(LEGACY, pal) ? LEGACY[pal] : 'mono';
        d.setAttribute('data-scheme', dark ? 'dark' : 'light');
        d.setAttribute('data-look', 'vercel');
        d.setAttribute('data-theme', 'mono');
        d.setAttribute('data-accent', pal);
        // The status bar matches the ground from the first frame, not only once the app
        // module loads (FEAT-016 V2 P2-9). These are the --ground tokens in theme.css;
        // design-system.test.tsx fails if they drift.
        // Every accent shares Mono's neutral ground, so only the scheme picks the colour.
        var GROUND = { 'light:mono': 'rgb(250, 250, 250)', 'dark:mono': 'rgb(10, 10, 10)' };
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', GROUND[(dark ? 'dark' : 'light') + ':mono']);
      })();
    </script>
    <!-- FEAT-011: the design system's typeface; FEAT-017 adds Geist + Geist Mono for Mono. A CDN link rather than a bundled
         dependency (CLAUDE.md: dependencies need owner approval); the system sans
         fallback carries an offline first-visit without shifting layout. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist:wght@400..800&family=Geist+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bulk Saving</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
