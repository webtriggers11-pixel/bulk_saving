<!doctype html>
<html lang="en" data-theme="teal" data-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- FEAT-016: viewport-fit=cover lets the app draw under the notch and home bar;
         safe-area insets keep content clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- FEAT-016 (ADR-0028): apply the remembered scheme and palette BEFORE first paint,
         so a night user never sees a white flash. Mirrors lib/appearance.ts; storage may
         be unavailable, in which case the system scheme and teal apply. -->
    <script>
      (function () {
        var d = document.documentElement, pref = 'system', pal = 'teal';
        try {
          pref = localStorage.getItem('bulk:scheme') || 'system';
          pal = localStorage.getItem('bulk:palette') || 'teal';
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (pal !== 'indigo' && pal !== 'ember') pal = 'teal';
        d.setAttribute('data-scheme', dark ? 'dark' : 'light');
        d.setAttribute('data-theme', pal);
        // The status bar matches the ground from the first frame, not only once the app
        // module loads (FEAT-016 V2 P2-9). These are the --ground tokens in theme.css;
        // design-system.test.tsx fails if they drift.
        var GROUND = {
          'light:teal': 'rgb(238, 242, 241)', 'light:indigo': 'rgb(239, 240, 248)', 'light:ember': 'rgb(246, 241, 236)',
          'dark:teal': 'rgb(11, 20, 19)', 'dark:indigo': 'rgb(12, 13, 26)', 'dark:ember': 'rgb(20, 13, 10)'
        };
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', GROUND[(dark ? 'dark' : 'light') + ':' + pal]);
      })();
    </script>
    <!-- FEAT-011: the design system's typeface. A CDN link rather than a bundled
         dependency (CLAUDE.md: dependencies need owner approval); the system sans
         fallback carries an offline first-visit without shifting layout. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bulk Saving</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
