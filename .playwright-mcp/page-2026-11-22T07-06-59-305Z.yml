    - region "Built for a phone in a society" [ref=f13e959]:
      - generic [ref=f13e960]:
        - generic [ref=f13e961]:
          - heading "Built for a phone in a society" [level=2] [ref=f13e962]:
            - generic [aria-hidden] [ref=f13e964]: Built
            - generic [aria-hidden] [ref=f13e966]: for
            - generic [aria-hidden] [ref=f13e968]: a
            - generic [aria-hidden] [ref=f13e970]: phone
            - generic [aria-hidden] [ref=f13e972]: in
            - generic [aria-hidden] [ref=f13e974]: a
            - generic [aria-hidden] [ref=f13e976]: society
          - paragraph [ref=f13e977]: No passwords, no app store, no re-login. Works when the signal drops.
        - generic [ref=f13e978]:
          - list [ref=f13e979]:
            - listitem [ref=f13e980]:
              - heading "Your society code and your phone" [level=3] [ref=f13e981]
              - generic [ref=f13e982]:
                - paragraph [ref=f13e983]: Enter the invite code your society gave you and your number. A one-time code arrives by SMS and you are in. Everything you see is scoped to your society.
                - paragraph [ref=f13e984]: In a society the phone is the identity. Codes live in memory with a time limit and are never logged or shown.
            - listitem [ref=f13e985]:
              - heading "Sign in with WhatsApp" [level=3] [ref=f13e986]
              - generic [ref=f13e987]:
                - paragraph [ref=f13e988]: Tap Continue with WhatsApp, send the message it opens, tap the number you see on screen, and you are back in the app, signed in. On a laptop, scan a QR code with your phone. The SMS code stays as the fallback.
                - paragraph [ref=f13e989]: WhatsApp already verified your number, and a message you start costs nothing. Three taps, nothing to type.
            - listitem [ref=f13e990]:
              - heading "Sign in once per phone" [level=3] [ref=f13e991]
              - generic [ref=f13e992]:
                - paragraph [ref=f13e993]: After the first code, this phone stays signed in. You can end a session from Profile.
                - paragraph [ref=f13e994]: You use this before summer and once a quarter. Being asked for a code every time kills a thirty-second visit.
            - listitem [ref=f13e995]:
              - heading "Add it to your home screen" [level=3] [ref=f13e996]
              - generic [ref=f13e997]:
                - paragraph [ref=f13e998]: Installs from the browser with no app store. A thumb-reachable bar for Home, Services, My Requests and Profile. When the signal drops it says so and shows what is stale.
                - paragraph [ref=f13e999]: A lost signal mid-round must never look like your round disappeared.
            - listitem [ref=f13e1000]:
              - heading "A real app icon on your home screen" [level=3] [ref=f13e1001]
              - generic [ref=f13e1002]:
                - paragraph [ref=f13e1003]: Installing gives a proper icon, a launch screen on iPhone, and long-press shortcuts straight to Services and My Requests. Home shows a small card explaining how to install on your phone.
                - paragraph [ref=f13e1004]: Something you open once a quarter has to be easy to find, and look like it belongs next to your other apps.
            - listitem [ref=f13e1005]:
              - heading "Home opens on what you can save today" [level=3] [ref=f13e1006]
              - generic [ref=f13e1007]:
                - paragraph [ref=f13e1008]: The first screen shows how many rounds are open and the three closing soonest, each one tap from its pledge sheet.
                - paragraph [ref=f13e1009]: The first screen should answer the only question you came with.
            - listitem [ref=f13e1010]:
              - heading "Feels like an app, not a page" [level=3] [ref=f13e1011]
              - generic [ref=f13e1012]:
                - paragraph [ref=f13e1013]: Bottom sheets for pledging and rating, large titles that tuck into a blurred bar as you scroll, safe-area aware, and a night mode that reveals itself in a circle from the switch.
                - paragraph [ref=f13e1014]: A page that feels like a website gets ignored; one that feels native gets installed.
            - listitem [ref=f13e1015]:
              - heading "A separate door for the operator" [level=3] [ref=f13e1016]
              - generic [ref=f13e1017]:
                - paragraph [ref=f13e1018]: The operator signs in on their own page with a phone number alone, with its own rate limits.
                - paragraph [ref=f13e1019]: Operators have no society invite code, and their door should not share a resident’s.
