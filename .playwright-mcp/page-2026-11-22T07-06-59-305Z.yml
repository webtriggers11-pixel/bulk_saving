          - list [ref=f13e886]:
            - listitem [ref=f13e887]:
              - heading "An SMS for every step" [level=3] [ref=f13e888]
              - generic [ref=f13e889]:
                - paragraph [ref=f13e890]: Pledge confirmed, closing soon, closed with the final price, vendor assigned, job delivered, round cancelled. Nothing to set up.
                - paragraph [ref=f13e891]: Each message is written in the same database transaction as the event, so you never get one for something that did not happen, and never get it twice.
            - listitem [ref=f13e892]:
              - heading "Push notifications in your colour" [level=3] [ref=f13e893]
              - generic [ref=f13e894]:
                - paragraph [ref=f13e895]: On an installed phone, a push arrives written for the event and tinted in the accent you chose. Tapping it opens the right round.
                - paragraph [ref=f13e896]: Bursts of hundreds of devices are sent by parallel workers that retry safely, never double-send and prune dead devices on their own.
    - region "Trust and accountability" [ref=f13e897]:
      - generic [ref=f13e898]:
        - generic [ref=f13e899]:
          - heading "Trust and accountability" [level=2] [ref=f13e900]:
            - generic [aria-hidden] [ref=f13e902]: Trust
            - generic [aria-hidden] [ref=f13e904]: and
            - generic [aria-hidden] [ref=f13e906]: accountability
          - paragraph [ref=f13e907]: A person negotiates every deal. A rating follows every job.
        - generic [ref=f13e908]:
          - list [ref=f13e909]:
            - listitem [ref=f13e910]:
              - heading "A person negotiates every deal" [level=3] [ref=f13e911]
              - generic [ref=f13e912]:
                - paragraph [ref=f13e913]: When a round closes met, the operator picks the vendor, records the negotiated price, marks the job delivered and tracks who has paid. Payment stays between you and the vendor.
                - paragraph [ref=f13e914]: Pooled demand is only worth something once someone turns it into a real job.
            - listitem [ref=f13e915]:
              - heading "Rate every delivered job" [level=3] [ref=f13e916]
              - generic [ref=f13e917]:
                - paragraph [ref=f13e918]: After delivery, every participant rates the job from 1 to 5 with an optional note. You can correct a mis-tap.
                - paragraph [ref=f13e919]: The moment we recommend a vendor, a bad job is on us. Ratings attach to the round, so a vendor’s score is the honest sum of the jobs they did.
            - listitem [ref=f13e920]:
              - heading "Ratings the operator can see" [level=3] [ref=f13e921]
              - generic [ref=f13e922]:
                - paragraph [ref=f13e923]: You rate from My Requests; the operator sees each vendor’s average and each round’s score.
                - paragraph [ref=f13e924]: The number has to be in front of the person who chooses the next vendor.
            - listitem [ref=f13e925]:
              - heading "A confirm before anything you cannot undo" [level=3] [ref=f13e926]
              - generic [ref=f13e927]:
                - paragraph [ref=f13e928]: Leaving a round, removing a rating, withdrawing an ask or logging out all ask once first, and say so honestly if you are offline.
                - paragraph [ref=f13e929]: A mis-tap must never cost a neighbour their place in a round.
