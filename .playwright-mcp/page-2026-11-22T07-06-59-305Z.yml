    - region "What Bulk Saving is, in one go" [ref=f13e314]:
      - generic [ref=f13e315]:
        - generic [ref=f13e316]:
          - heading "What Bulk Saving is, in one go" [level=2] [ref=f13e317]:
            - generic [aria-hidden] [ref=f13e319]: What
            - generic [aria-hidden] [ref=f13e321]: Bulk
            - generic [aria-hidden] [ref=f13e323]: Saving
            - generic [aria-hidden] [ref=f13e325]: is,
            - generic [aria-hidden] [ref=f13e327]: in
            - generic [aria-hidden] [ref=f13e329]: one
            - generic [aria-hidden] [ref=f13e331]: go
          - paragraph [ref=f13e332]: A demand-aggregation platform for home services, scoped to one housing society at a time. Neighbours pool what they already need; a negotiated vendor does it as one job; everyone pays the bulk price.
        - list "The mechanic" [ref=f13e333]:
          - listitem [ref=f13e334]:
            - generic [ref=f13e335]: "1"
            - heading "Neighbours pool" [level=3] [ref=f13e336]
            - paragraph [ref=f13e337]: "A round opens for one service in one society with a deadline. Residents pledge units in one tap: 2 ACs, 3 rooms, one 25 kg bag."
          - listitem [ref=f13e338]:
            - generic [ref=f13e339]: "2"
            - heading "The price drops" [level=3] [ref=f13e340]
            - paragraph [ref=f13e341]: "Thresholds count units. Every pledge moves everyone down the ladder: ₹1,000 alone, ₹800 at five, ₹700 at ten."
          - listitem [ref=f13e342]:
            - generic [ref=f13e343]: "3"
            - heading "One job, one visit" [level=3] [ref=f13e344]
            - paragraph [ref=f13e345]: At the deadline the round closes itself. The operator books a rated vendor at the unlocked price; residents rate the work.
        - generic [ref=f13e346]:
          - figure "How money and work flow" [ref=f13e347]:
            - img [aria-hidden] [ref=f13e348]:
              - generic [ref=f13e349]:
                - generic [ref=f13e351]: Residents
                - generic [ref=f13e352]: pledge units
              - generic [ref=f13e353]:
                - generic [ref=f13e355]: The round
                - generic [ref=f13e356]: pooled, priced by tier
              - generic [ref=f13e357]:
                - generic [ref=f13e359]: Vendor
                - generic [ref=f13e360]: one visit, bulk price
              - generic [ref=f13e362]: Operator
            - generic [ref=f13e365]: "The job comes back to the society. The operator sees demand first, negotiates with the number in hand, books the work, and earns a commission on each pooled job. No inventory, no payment risk in the pilot: residents pay the vendor, the app tracks it."
          - generic [ref=f13e366]:
            - generic [ref=f13e367]:
              - strong [ref=f13e368]: ₹300
              - generic [ref=f13e369]: saved on a ₹1,000 AC service when ten AC units pool, the brief's worked example
            - generic [ref=f13e370]:
              - strong [ref=f13e371]: 100–400
              - generic [ref=f13e372]: "flats in a typical urban society: dozens wanting the same service in the same season"
            - generic [ref=f13e373]:
              - strong [ref=f13e374]: "23"
              - generic [ref=f13e375]: services live across six categories, from AC servicing to a 25 kg bag of rice
            - generic [ref=f13e376]:
              - strong [ref=f13e377]: 4.0+
              - generic [ref=f13e378]: "out of 5: the delivered-job rating the pilot must average, the bar every vendor is measured against"
        - generic [ref=f13e379]:
          - tablist "Who gains what" [ref=f13e380]:
            - tab "Residents" [selected] [ref=f13e381] [cursor=pointer]
            - tab "Societies" [ref=f13e382] [cursor=pointer]
