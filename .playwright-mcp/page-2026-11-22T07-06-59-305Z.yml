        - list [ref=f13e838]:
          - listitem [ref=f13e839]:
            - heading "A catalog for your society" [level=3] [ref=f13e840]
            - generic [ref=f13e841]:
              - paragraph [ref=f13e842]: Services shows what is offered to your society, with an indicative price and what the job covers.
              - paragraph [ref=f13e843]: One society’s deal never leaks into another’s.
          - listitem [ref=f13e844]:
            - heading "From a service to booking in one tap" [level=3] [ref=f13e845]
            - generic [ref=f13e846]:
              - paragraph [ref=f13e847]: "A service with an open round shows it on its card: today’s price, units joined, when it closes. Tapping the card opens that round with the pledge sheet already up."
              - paragraph [ref=f13e848]: Sessions last about thirty seconds. Every extra screen between intent and pledge loses a neighbour.
          - listitem [ref=f13e849]:
            - heading "Ask for this service" [level=3] [ref=f13e850]
            - generic [ref=f13e851]:
              - paragraph [ref=f13e852]: No round open? Tap Ask for this and see how many neighbours already asked. When the operator opens a round, everyone who asked hears first.
              - paragraph [ref=f13e853]: Asking turns invisible intent into a number the operator can act on, and rewards the askers with first notice.
          - listitem [ref=f13e854]:
            - heading "Twenty-three services across six categories" [level=3] [ref=f13e855]
            - generic [ref=f13e856]:
              - paragraph [ref=f13e857]: Appliances, home care, renovation, utilities, vehicle care and bulk staples. The operator switches each one on per society and sets its price.
              - paragraph [ref=f13e858]: A catalog the operator cannot shape is not a product.
    - region "Never miss a round" [ref=f13e859]:
      - generic [ref=f13e860]:
        - generic [ref=f13e861]:
          - heading "Never miss a round" [level=2] [ref=f13e862]:
