            - tab "The platform" [ref=f13e384] [cursor=pointer]
          - tabpanel "Residents" [ref=f13e385]:
            - heading "Cheaper, trusted, zero organising" [level=3] [ref=f13e386]
            - list [ref=f13e387]:
              - listitem [ref=f13e388]: "Pay the pooled price, not the single-customer price: about ₹300 less on a ₹1,000 AC service."
              - listitem [ref=f13e389]: One tap to join; the deadline and the vendor are handled.
              - listitem [ref=f13e390]: A rating on every job keeps vendors honest.
        - generic [ref=f13e391]:
          - heading "Why it holds" [level=3] [ref=f13e392]
          - generic [ref=f13e393]:
            - generic [ref=f13e394]:
              - strong [ref=f13e395]: The discount is real economics.
              - paragraph [ref=f13e396]: Pooling removes the vendor's per-job acquisition and travel cost. The lower price is not a subsidy.
            - generic [ref=f13e397]:
              - strong [ref=f13e398]: Demand before supply.
              - paragraph [ref=f13e399]: Residents ask and pledge before anyone buys; the operator negotiates with a number, not a hope.
            - generic [ref=f13e400]:
              - strong [ref=f13e401]: Trust is measured.
              - paragraph [ref=f13e402]: Every delivered job is rated by the people who paid for it; vendors earn the next round.
            - generic [ref=f13e403]:
              - strong [ref=f13e404]: Built to multiply.
              - paragraph [ref=f13e405]: "Multi-tenant from the first line: a new society is an invite code; a new service is a row, not a release."
    - region "How a group buy works" [ref=f13e406]:
      - generic [ref=f13e407]:
        - generic [ref=f13e408]:
