            - generic [aria-hidden] [ref=f13e1265]: goes
            - generic [aria-hidden] [ref=f13e1267]: from
            - generic [aria-hidden] [ref=f13e1269]: here
          - paragraph [ref=f13e1270]: Shipped, next, and later. The pilot proves fill rates and ratings in one city; the platform is already built to multiply.
        - list [ref=f13e1271]:
          - listitem [ref=f13e1272]:
            - heading "Now" [level=3] [ref=f13e1273]
            - list [ref=f13e1275]:
              - listitem [ref=f13e1276]:
                - strong [ref=f13e1277]: Ready for the first societies
                - paragraph [ref=f13e1278]: Phone sign-in, the catalog, group-buy rounds, SMS and push, ratings, the operator dashboard, and a bulk-staples pilot are built and verified; the first society goes live in the pilot.
              - listitem [ref=f13e1279]:
                - strong [ref=f13e1280]: Sign in with WhatsApp
                - paragraph [ref=f13e1281]: "Tap to verify: the resident sends one message, taps the matching number, and is signed in. Free per login; the SMS code stays as the fallback."
          - listitem [ref=f13e1282]:
            - heading "Next" [level=3] [ref=f13e1283]
            - list [ref=f13e1285]:
              - listitem [ref=f13e1286]:
                - strong [ref=f13e1287]: WhatsApp round updates
                - paragraph [ref=f13e1288]: Round alerts over WhatsApp where societies already live, behind the same notification interface that sends SMS and push today.
              - listitem [ref=f13e1289]:
                - strong [ref=f13e1290]: More services, more societies
                - paragraph [ref=f13e1291]: "The catalog is data, not code: the operator adds a service and switches it on per society. The platform is multi-tenant from day one."
          - listitem [ref=f13e1292]:
            - heading "Later" [level=3] [ref=f13e1293]
            - list [ref=f13e1295]:
              - listitem [ref=f13e1296]:
                - strong [ref=f13e1297]: Recurring plans and warranty
                - paragraph [ref=f13e1298]: "Own the relationship, not just the first job: a quarterly pest-control or pre-summer AC plan, with the vendor accountable through us."
              - listitem [ref=f13e1299]:
                - strong [ref=f13e1300]: Vendor tools and new cities
                - paragraph [ref=f13e1301]: A vendor-side view and regional operators once the pilot proves fill rates and ratings in one city.
