            - generic [aria-hidden] [ref=f13e419]: works
          - paragraph [ref=f13e420]: A round is a shared deadline and a price that falls as neighbours join.
        - generic [ref=f13e421]:
          - list [ref=f13e422]:
            - listitem [ref=f13e423]:
              - heading "The operator opens a round" [level=3] [ref=f13e424]
              - paragraph [ref=f13e425]: "One service, one society, a deadline, and a price ladder negotiated with a vendor: ₹1,000 alone, ₹800 at 5 ACs, ₹700 at 10."
