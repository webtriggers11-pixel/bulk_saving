          - list [ref=f13e1088]:
            - listitem [ref=f13e1089]:
              - heading "Flat paper, hairlines, Geist" [level=3] [ref=f13e1090]
              - generic [ref=f13e1091]:
                - paragraph [ref=f13e1092]: Surfaces are paper with a one-pixel line. Corners are tight. The primary button is ink by day and near-white by night.
                - paragraph [ref=f13e1093]: Calm and precise reads as trustworthy. Nothing glows that does not need to.
            - listitem [ref=f13e1094]:
              - heading "Seven colour pairs, one look" [level=3] [ref=f13e1095]
              - generic [ref=f13e1096]:
                - paragraph [ref=f13e1097]: Pick mono, ocean, aurora, bloom, sunset, forest or lagoon. The geometry never changes; only the accent does. Small sparks mark a saving unlocked, and all of it stops if your phone asks for less motion.
                - paragraph [ref=f13e1098]: Choice without losing coherence.
            - listitem [ref=f13e1099]:
              - heading "One set of tokens under everything" [level=3] [ref=f13e1100]
              - generic [ref=f13e1101]:
                - paragraph [ref=f13e1102]: Colour, radius and type are variables, and every text-on-surface pair is tested for contrast in light and dark.
                - paragraph [ref=f13e1103]: This site and the app share the same token sheet, pinned by a test, so what you see here is what you get.
            - listitem [ref=f13e1104]:
              - heading "Search and filters that stick" [level=3] [ref=f13e1105]
              - generic [ref=f13e1106]:
                - paragraph [ref=f13e1107]: Search any list by name, filter by category or status. The filter lives in the address, so a refresh or a shared link keeps it.
                - paragraph [ref=f13e1108]: A catalog of twenty-three services and lists across societies need real search.
