        - list [ref=f13e499]:
          - listitem [ref=f13e500]:
            - heading "Group-buy rounds" [level=3] [ref=f13e501]
            - generic [ref=f13e502]:
              - paragraph [ref=f13e503]: A round is a time-boxed group buy for one service in your society. You join with the number of units you need, and everyone pays the best price the pooled units have reached.
              - paragraph [ref=f13e504]: Thresholds count units, not people, so one flat with three ACs moves the group as much as three flats.
          - listitem [ref=f13e505]:
            - heading "A price ladder you can see" [level=3] [ref=f13e506]
            - generic [ref=f13e507]:
              - paragraph [ref=f13e508]: Each round shows every tier, where the count is now, and how many more units unlock the next price. A live countdown runs inside the last day, and one tap shares the round with neighbours.
              - paragraph [ref=f13e509]: The more neighbours join, the cheaper it gets for everyone. That has to be seen, not read in a footnote.
          - listitem [ref=f13e510]:
            - heading "Deadlines that mean it" [level=3] [ref=f13e511]
            - generic [ref=f13e512]:
              - paragraph [ref=f13e513]: Rounds close themselves at the deadline. If the minimum tier was reached, the round goes to the operator for a vendor; if not, everyone is told it expired.
              - paragraph [ref=f13e514]: A deadline only creates urgency when the system keeps it without anyone watching the clock.
          - listitem [ref=f13e515]:
            - heading "Units in the service’s own words" [level=3] [ref=f13e516]
            - generic [ref=f13e517]:
              - paragraph [ref=f13e518]: You pledge 2 rooms for deep cleaning, 3 ACs for servicing, or one 25 kg pack of rice. Every count on screen uses the service’s own noun.
              - paragraph [ref=f13e519]: “2 units” is abstract and causes mistakes; “2 rooms” is a pledge you can trust.
