services:
  postgres:
    image: postgres:16
    container_name: bulk_saving_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bulk_saving
    ports:
      - '5442:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bulk_saving']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: bulk_saving_redis
    restart: unless-stopped
    ports:
      - '6399:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  redisdata:
