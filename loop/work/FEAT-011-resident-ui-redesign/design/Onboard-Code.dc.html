<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root,[data-theme="teal"]{--brand:#0F766E;--brand-deep:#0A544C;--brand-lt:#2ED6BB;--brand-ink:#095049;--brand-rgb:15,118,110;--brand-lt-rgb:46,214,187;--ground-a:#EEF2F1;--ground-b:#F5F8F7;--ink:#0C1B19;--ink-2:#4E615C;--ink-3:#687A74;--sh:9,52,47;--mesh-1:rgba(46,214,187,.26);--mesh-2:rgba(15,118,110,.18);--mesh-3:rgba(63,118,140,.16)}
[data-theme="indigo"]{--brand:#4F46E5;--brand-deep:#312E81;--brand-lt:#8B8CFF;--brand-ink:#3730A3;--brand-rgb:79,70,229;--brand-lt-rgb:139,140,255;--ground-a:#EFF0F8;--ground-b:#F6F7FC;--ink:#14142B;--ink-2:#545473;--ink-3:#6C6C8E;--sh:30,27,75;--mesh-1:rgba(139,140,255,.30);--mesh-2:rgba(79,70,229,.20);--mesh-3:rgba(236,72,153,.14)}
[data-theme="ember"]{--brand:#C2410C;--brand-deep:#7C2D12;--brand-lt:#FB923C;--brand-ink:#9A3412;--brand-rgb:194,65,12;--brand-lt-rgb:251,146,60;--ground-a:#F6F1EC;--ground-b:#FBF7F3;--ink:#221310;--ink-2:#6A5248;--ink-3:#7A5C50;--sh:90,40,15;--mesh-1:rgba(251,146,60,.30);--mesh-2:rgba(194,65,12,.16);--mesh-3:rgba(180,120,90,.18)}
body{margin:0;font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:var(--ground-a);color:var(--ink)}
a{color:var(--brand);text-decoration:none}a:hover{color:var(--brand-ink)}
*{-webkit-tap-highlight-color:transparent}
input,textarea,button{font-family:inherit}
dl,dd,dt{margin:0}ul,ol{margin:0;padding:0;list-style:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* motion vocabulary */
.t{transition:transform .34s cubic-bezier(.22,.8,.28,1),box-shadow .34s cubic-bezier(.22,.8,.28,1),background-color .26s ease,background-image .26s ease,border-color .26s ease,color .22s ease,opacity .26s ease,filter .26s ease}
.t-fast{transition:transform .16s cubic-bezier(.3,.9,.4,1),opacity .16s ease,color .16s ease,background-color .16s ease}

/* entrance */
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
@keyframes riseSm{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blurIn{from{opacity:0;filter:blur(10px);transform:translateY(8px) scale(.96)}to{opacity:1;filter:blur(0);transform:none}}
.rise{animation:rise .78s cubic-bezier(.22,.9,.26,1) both}
.blur-in{animation:blurIn .9s cubic-bezier(.22,.9,.26,1) both}
.stagger>*{animation:rise .78s cubic-bezier(.22,.9,.26,1) both}
.stagger>*:nth-child(1){animation-delay:.04s}.stagger>*:nth-child(2){animation-delay:.12s}
.stagger>*:nth-child(3){animation-delay:.20s}.stagger>*:nth-child(4){animation-delay:.28s}
.stagger>*:nth-child(5){animation-delay:.36s}.stagger>*:nth-child(6){animation-delay:.44s}
.stagger>*:nth-child(7){animation-delay:.52s}.stagger>*:nth-child(8){animation-delay:.60s}
.fade-in{animation:riseSm .6s ease both;animation-delay:.34s}

/* ambient */
@keyframes driftA{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(38px,26px,0) scale(1.14)}100%{transform:translate3d(0,0,0) scale(1)}}
@keyframes driftB{0%{transform:translate3d(0,0,0) scale(1.06)}50%{transform:translate3d(-34px,34px,0) scale(.9)}100%{transform:translate3d(0,0,0) scale(1.06)}}
@keyframes driftC{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(26px,-32px,0) scale(1.1)}100%{transform:translate3d(0,0,0)}}
.blob{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none;will-change:transform}
.blob-a{animation:driftA 22s ease-in-out infinite}.blob-b{animation:driftB 27s ease-in-out infinite}.blob-c{animation:driftC 19s ease-in-out infinite}

/* cards */
.card{will-change:transform}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 1px rgba(255,255,255,.9) inset,0 4px 8px rgba(var(--sh),.06),0 36px 66px -30px rgba(var(--sh),.6)}
.card-glow{position:relative}
.card-glow::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(255,255,255,.95),rgba(var(--brand-lt-rgb),.55),rgba(255,255,255,0) 62%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.5;pointer-events:none;transition:opacity .4s ease}
.card-glow:hover::after{opacity:1}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.halo::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0deg,rgba(var(--brand-lt-rgb),.30) 60deg,transparent 140deg,transparent 360deg);animation:spinSlow 11s linear infinite;pointer-events:none}

/* buttons */
@keyframes sweep{0%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(320%) skewX(-18deg)}}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:38%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-120%) skewX(-18deg);pointer-events:none}
.btn:hover::after{animation:sweep .85s cubic-bezier(.3,.8,.3,1)}
.btn:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.34) inset,0 18px 30px -14px rgba(var(--sh),.75)}
.btn:active{transform:translateY(0) scale(.975);transition-duration:.12s}
.btn:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(var(--brand-rgb),.28),0 12px 26px -12px rgba(var(--sh),.7)}
.btn .nudge{transition:transform .28s cubic-bezier(.22,.9,.26,1)}
.btn:hover .nudge{transform:translateX(4px)}
.soft:hover{background-image:linear-gradient(165deg,#FFFFFF,rgba(255,255,255,.84))}
.tap:active{transform:scale(.93);transition-duration:.12s}
.tap:hover{transform:translateY(-2px)}
@keyframes ripple{from{transform:translate(-50%,-50%) scale(0);opacity:.5}to{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
.ripple::before{content:"";position:absolute;left:50%;top:50%;width:120%;padding-bottom:120%;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}
.ripple:active::before{animation:ripple .55s ease-out}

/* inputs */
@keyframes ringIn{from{box-shadow:0 0 0 0 rgba(var(--brand-rgb),.34)}to{box-shadow:0 0 0 5px rgba(var(--brand-rgb),.17)}}
input:focus,textarea:focus{outline:none;border-color:rgba(var(--brand-rgb),.6);animation:ringIn .28s ease-out forwards}
input::placeholder,textarea::placeholder{color:var(--ink-3);font-weight:500}
.field:focus-within .field-label{color:var(--brand-ink);transform:translateY(-1px)}
.field-label{transition:color .22s ease,transform .22s ease}

/* live signals */
@keyframes pulseTeal{0%{box-shadow:0 0 0 0 rgba(var(--brand-rgb),.45)}70%{box-shadow:0 0 0 8px rgba(var(--brand-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--brand-rgb),0)}}
.dot-teal{animation:pulseTeal 2.6s ease-out infinite}
@keyframes pulseGreen{0%{box-shadow:0 0 0 0 rgba(22,163,74,.45)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.dot-live{animation:pulseGreen 2.4s ease-out infinite}
@keyframes breathe{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
.breathe{animation:breathe 3.4s ease-in-out infinite}

/* progress + skeleton */
@keyframes grow{from{width:0}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.bar-fill{animation:grow 1.5s cubic-bezier(.22,.9,.26,1) both;position:relative;overflow:hidden}
.bar-fill::after{content:"";position:absolute;inset:0;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:shimmer 2.6s ease-in-out infinite}
@keyframes skeleton{0%{transform:translateX(-100%)}100%{transform:translateX(230%)}}
@keyframes skelPulse{0%,100%{opacity:.75}50%{opacity:1}}
.skel{position:relative;overflow:hidden;background-image:linear-gradient(120deg,rgba(var(--sh),.09),rgba(var(--sh),.05));animation:skelPulse 2.2s ease-in-out infinite}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:skeleton 1.7s ease-in-out infinite}
.skel-d1::after{animation-delay:.12s}.skel-d2::after{animation-delay:.24s}.skel-d3::after{animation-delay:.36s}

/* accent surface effects */
@keyframes glide{0%{transform:translate3d(-30%,-10%,0) scale(1)}50%{transform:translate3d(30%,14%,0) scale(1.22)}100%{transform:translate3d(-30%,-10%,0) scale(1)}}
.orb{position:absolute;border-radius:50%;filter:blur(30px);pointer-events:none;animation:glide 14s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-130%) rotate(14deg)}55%,100%{transform:translateX(240%) rotate(14deg)}}
.sheen::before{content:"";position:absolute;top:-40%;bottom:-40%;width:34%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:sheen 6.5s cubic-bezier(.4,.1,.3,1) infinite;pointer-events:none}

/* celebration */
@keyframes burst{0%{transform:translate(0,0) scale(0);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--brand-lt);animation:burst 1.4s cubic-bezier(.2,.8,.3,1) infinite;pointer-events:none}

/* spinners, stars, checks, toast, tabs */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .85s linear infinite}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .42s cubic-bezier(.3,1.3,.5,1) both}
.star-hit:hover{transform:scale(1.2) rotate(-7deg)}
.star-hit:active{transform:scale(.94)}
@keyframes draw{to{stroke-dashoffset:0}}
.draw{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .7s cubic-bezier(.22,.9,.26,1) .25s forwards}
@keyframes slideUp{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.slide-up{animation:slideUp .5s cubic-bezier(.22,.9,.26,1) both}
@keyframes strip{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.strip-in{animation:strip .5s cubic-bezier(.22,.9,.26,1) both}
.tab .tab-pill{transition:transform .34s cubic-bezier(.3,1.2,.4,1),background-color .26s ease,box-shadow .3s ease,opacity .26s ease}
.tab:hover .tab-pill{transform:translateY(-3px)}
.tab:active .tab-pill{transform:scale(.9)}
.tab-on .tab-pill{box-shadow:0 8px 18px -10px rgba(var(--sh),.9)}
@keyframes tabIn{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
.tab-line{animation:tabIn .5s cubic-bezier(.3,1.1,.4,1) both}

.grain{position:absolute;inset:0;opacity:.055;mix-blend-mode:overlay;pointer-events:none}
.chip:hover{transform:translateY(-1px)}
.row-hover:hover{background-color:rgba(255,255,255,.55)}
.ic-spin:hover{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</helmet>
<div data-theme="{{theme}}" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background-color:var(--ground-a);background-image:radial-gradient(900px 520px at 4% -12%,var(--mesh-1),transparent 64%),radial-gradient(680px 460px at 112% 2%,var(--mesh-2),transparent 62%),radial-gradient(760px 560px at 46% 116%,var(--mesh-3),transparent 66%),linear-gradient(180deg,var(--ground-b) 0%,var(--ground-a) 100%);">
<div class="blob blob-a" style="top:-90px;left:-70px;width:260px;height:260px;background:radial-gradient(circle,var(--mesh-1),transparent 68%)"></div><div class="blob blob-b" style="top:180px;right:-110px;width:280px;height:280px;background:radial-gradient(circle,var(--mesh-2),transparent 70%)"></div><div class="blob blob-c" style="bottom:-60px;left:-40px;width:240px;height:240px;background:radial-gradient(circle,var(--mesh-3),transparent 70%)"></div>
<svg class="grain" aria-hidden="true" width="100%" height="100%"><filter id="grain-ob3"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grain-ob3)" opacity="0.55"/></svg>

<main style="position:relative;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column">
  <div class="rise" style="flex:1 1 0;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:40px 28px 24px">
    <span class="breathe" style="align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
      background-image:linear-gradient(160deg,rgba(255,255,255,.88),rgba(255,255,255,.48));border:1px solid rgba(255,255,255,.85);
      font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-ink);
      box-shadow:0 12px 26px -18px rgba(var(--sh),.9)"><svg aria-hidden="true" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><circle cx="9.2" cy="8.4" r="3.4"/><path d="M2.8 20.2c.9-3.2 3.3-5 6.4-5s5.5 1.8 6.4 5"/><path d="M16 5.4a3.4 3.4 0 0 1 0 6.2"/><path d="M17.6 15.6c2 .8 3.2 2.3 3.7 4.6"/></svg>Society group buys</span>
    <h1 class="blur-in" style="margin:0;font-size:48px;font-weight:800;letter-spacing:-.058em;line-height:.94;
      background-image:linear-gradient(135deg,var(--ink) 0%,var(--brand) 56%,var(--brand-lt) 100%);-webkit-background-clip:text;
      background-clip:text;color:transparent">Bulk<br>Saving</h1>
    <p style="margin:0;max-width:280px;font-size:15px;font-weight:500;line-height:1.5;color:var(--ink-2)">Join your society to start saving together.</p>
    <ol aria-label="Onboarding progress" style="display:flex;align-items:center;gap:8px;margin:0;padding:0;list-style:none"><li class="t" style="height:6px;width:34px;border-radius:999px;overflow:hidden;background-color:rgba(var(--sh),.14);box-shadow:0 1px 2px rgba(var(--sh),.12) inset"><span class="bar-fill" style="display:block;height:100%;width:100%;border-radius:999px;animation-delay:0.25s;background-image:linear-gradient(90deg,var(--brand-deep),var(--brand-lt));box-shadow:0 3px 10px -3px rgba(var(--brand-rgb),.95)"></span></li><li class="t" style="height:6px;width:34px;border-radius:999px;overflow:hidden;background-color:rgba(var(--sh),.14);box-shadow:0 1px 2px rgba(var(--sh),.12) inset"><span class="bar-fill" style="display:block;height:100%;width:100%;border-radius:999px;animation-delay:0.37s;background-image:linear-gradient(90deg,var(--brand-deep),var(--brand-lt));box-shadow:0 3px 10px -3px rgba(var(--brand-rgb),.95)"></span></li><li class="t" style="height:6px;width:52px;border-radius:999px;overflow:hidden;background-color:rgba(var(--sh),.14);box-shadow:0 1px 2px rgba(var(--sh),.12) inset"><span class="bar-fill" style="display:block;height:100%;width:100%;border-radius:999px;animation-delay:0.49s;background-image:linear-gradient(90deg,var(--brand-deep),var(--brand-lt));box-shadow:0 3px 10px -3px rgba(var(--brand-rgb),.95)"></span></li></ol>
  </div>
  <section class="rise" style="animation-delay:.14s;position:relative;padding:28px 24px 30px;border-radius:34px 34px 0 0;
    background-image:linear-gradient(170deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.72) 100%);
    backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);
    border-top:1px solid rgba(255,255,255,.95);
    box-shadow:0 -1px 0 rgba(255,255,255,.9) inset,0 -30px 64px -30px rgba(var(--sh),.6)">
    <span style="display:block;width:44px;height:5px;margin:0 auto 22px;border-radius:999px;background-color:rgba(var(--sh),.18)"></span>
    <h2 style="margin:0;font-size:19px;font-weight:800;letter-spacing:-.028em;line-height:1.22;color:var(--ink);font-size:22px">Enter the code</h2>
    <p style="margin:0;font-size:13px;font-weight:500;line-height:1.5;color:var(--ink-2);margin-top:8px;margin-bottom:22px">Sent by SMS to <span class="num" style="font-weight:700;color:var(--ink)">+91 98765 43210</span>.</p>
    <form class="field">
      <label for="code" class="field-label" style="display:block;margin:0 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);">6-digit code</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="t num" value="481902"
             style="width:100%;box-sizing:border-box;height:50px;padding:0 15px;border-radius:16px;border:1px solid rgba(255,255,255,.74);color:var(--ink);background-image:linear-gradient(170deg,rgba(255,255,255,.94),rgba(255,255,255,.72));font-family:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;box-shadow:0 1px 2px rgba(var(--sh),.06) inset,0 1px 0 rgba(255,255,255,.7);height:64px;font-size:27px;font-weight:800;letter-spacing:.38em;text-align:center;
             border-color:rgba(var(--brand-rgb),.6);box-shadow:0 0 0 5px rgba(var(--brand-rgb),.17),0 1px 2px rgba(var(--sh),.06) inset">
      <label for="name" class="field-label" style="display:block;margin:0 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-top:18px">Your name <span style="font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink-3)">(optional)</span></label>
      <input id="name" name="name" autocomplete="name" placeholder="e.g. Priya Sharma" class="t" style="width:100%;box-sizing:border-box;height:50px;padding:0 15px;border-radius:16px;border:1px solid rgba(255,255,255,.74);color:var(--ink);background-image:linear-gradient(170deg,rgba(255,255,255,.94),rgba(255,255,255,.72));font-family:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;box-shadow:0 1px 2px rgba(var(--sh),.06) inset,0 1px 0 rgba(255,255,255,.7);">
      <button type="submit" class="t btn ripple" style="position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 22px;border-radius:16px;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-.015em;cursor:pointer;box-sizing:border-box;border:1px solid rgba(255,255,255,.20);color:#FFFFFF;background-image:radial-gradient(130% 120% at 14% 0%,rgba(var(--brand-lt-rgb),.55),transparent 58%),linear-gradient(140deg,var(--brand),var(--brand-deep));box-shadow:0 1px 0 rgba(255,255,255,.34) inset,0 12px 26px -12px rgba(var(--sh),.9);width:100%;margin-top:22px">Verify &amp; continue<span class="nudge" style="display:flex"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;"><path d="M4.6 12h14"/><path d="m13 6.4 5.6 5.6-5.6 5.6"/></svg></span></button>
      <p style="margin:16px 0 0;text-align:center;font-size:13.5px;font-weight:500;color:var(--ink-2)">Didn't get it?
        <a href="#" class="t" style="font-weight:800;color:var(--brand-ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px">Resend code</a></p>
    </form>
  </section>
</main>
</div>
